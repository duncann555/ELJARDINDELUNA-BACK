services:
  - type: web
    name: el-jardin-de-luna-backend
    runtime: node
    buildCommand: npm ci
    startCommand: npm start
    autoDeployTrigger: off
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: "3001"
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: FRONTEND_URL
        value: https://www.eljardindeluna.ar
      - key: CORS_ORIGINS
        value: https://www.eljardindeluna.ar,https://eljardindeluna.ar
      - key: BACKEND_PUBLIC_URL
        sync: false
      - key: MERCADO_PAGO_MODE
        value: production
      - key: MERCADO_PAGO_ACCESS_TOKEN
        sync: false
      - key: MERCADO_PAGO_WEBHOOK_SECRET
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: ADMIN_TOKEN_EXPIRES_IN
        value: 30m
      - key: SHIPPING_COST
        value: "15000"
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
